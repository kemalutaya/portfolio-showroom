<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO comes from the content package's site.json (%site.*% tokens,
         filled at build by packages/core/vite/site-config.ts). -->
    <title>Mara Lindqvist - Automation &amp; funnel builder</title>
    <meta name="description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    <meta name="author" content="Mara Lindqvist" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the desktop colour of the current mode. -->
    <meta name="theme-color" content="#CFC9B8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/portfolio-showroom/v04-desktop-os/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mara Lindqvist" />
    <meta property="og:title" content="Mara Lindqvist - Automation &amp; funnel builder" />
    <meta property="og:description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Mode before first paint: the saved choice, else the system's. Hex
         values mirror --desk in styles/tokens.css. -->
    <script>
      (function () {
        var t = 'light';
        try {
          var s = localStorage.getItem('theme');
          if (s === 'dark' || s === 'light') t = s;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#23252B');
      })();
    </script>
    <script type="module" crossorigin src="/portfolio-showroom/v04-desktop-os/assets/index-pzhUTR6d.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio-showroom/v04-desktop-os/assets/index-CvwM00f1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
