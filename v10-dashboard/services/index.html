<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO comes from the content package's site.json (%site.*% tokens,
         filled at build by packages/core/vite/site-config.ts). -->
    <title>Mara Lindqvist - Automation &amp; funnel builder</title>
    <meta name="description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    <meta name="author" content="Mara Lindqvist" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- The browser bar takes the ground colour of the current theme. -->
    <meta name="theme-color" content="#0F1720" />
    <link rel="icon" type="image/svg+xml" href="/portfolio-showroom/v10-dashboard/favicon.svg" />

    <!-- The avatar is in the top bar on every screen. -->
    <link rel="preload" as="image" href="/portfolio-showroom/v10-dashboard/people/mara-lindqvist.jpg" fetchpriority="high" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mara Lindqvist" />
    <meta property="og:title" content="Mara Lindqvist - Automation &amp; funnel builder" />
    <meta property="og:description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Theme before first paint: dark is the workspace's own look; light is
         the visitor's saved opt-in. Hex values mirror --bg in tokens.css. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') t = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F5F7FA');
      })();
    </script>
    <script type="module" crossorigin src="/portfolio-showroom/v10-dashboard/assets/index-DklKqvkV.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio-showroom/v10-dashboard/assets/index-e7kKr30T.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
