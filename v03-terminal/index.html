<!doctype html>
<html lang="en" data-phosphor="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO comes from the content package's site.json (%site.*% tokens,
         filled at build by packages/core/vite/site-config.ts). -->
    <title>Mara Lindqvist - Automation &amp; funnel builder</title>
    <meta name="description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    <meta name="author" content="Mara Lindqvist" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0B0F0A" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/portfolio-showroom/v03-terminal/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mara Lindqvist" />
    <meta property="og:title" content="Mara Lindqvist - Automation &amp; funnel builder" />
    <meta property="og:description" content="Booking funnels, CRMs and AI assistants for clinics and studios, built in Lisbon." />
    
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Phosphor before first paint: the saved choice, else green. Hex
         values mirror --bg in tokens.css. -->
    <script>
      (function () {
        var p = 'green';
        try {
          if (localStorage.getItem('phosphor') === 'amber') p = 'amber';
        } catch (e) {}
        document.documentElement.dataset.phosphor = p;
        if (p === 'amber') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F0C06');
      })();
    </script>
    <script type="module" crossorigin src="/portfolio-showroom/v03-terminal/assets/index-CeR-Wr-8.js"></script>
    <link rel="stylesheet" crossorigin href="/portfolio-showroom/v03-terminal/assets/index-Cj3NwGL0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
